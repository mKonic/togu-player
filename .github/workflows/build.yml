name: CI

# Same triggers as Komikku's build workflow. Releases build on a tag push in release.yml instead.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04
    # Ubuntu's Qt is too old (6.4); Togu needs 6.8+, and Arch is what it's packaged for.
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja rust \
            qt6-base qt6-declarative qt6-webengine mpv libarchive ffmpeg noto-fonts-cjk

      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The version name and code come from tags and the commit count.
          fetch-depth: 0

      - name: Build and run tests
        run: |
          git config --global --add safe.directory '*'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      # makepkg won't run as root; the package is built from this checkout.
      - name: Build the package
        id: pkg
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p /tmp/pkg && cp packaging/PKGBUILD /tmp/pkg/
          sed -i "s|^source=.*|source=(\"togu-player::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          sudo -u builder git config --global --add safe.directory '*'
          (cd /tmp/pkg && sudo -u builder makepkg --nodeps --noconfirm)
          ref=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | sed -E 's/[-\/]+/_/g')
          name="Togu-${ref}-r$(git rev-list --count HEAD)"
          mkdir -p dist
          cp /tmp/pkg/*.pkg.tar.zst "dist/$name-x86_64.pkg.tar.zst"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.pkg.tar.zst
