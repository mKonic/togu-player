name: Release

# Builds and publishes a release when a v* tag is pushed.
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # Ubuntu's Qt is too old (6.4); Togu needs 6.8+, and Arch is what it's packaged for.
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja rust github-cli \
            qt6-base qt6-declarative qt6-webengine mpv libarchive ffmpeg noto-fonts-cjk

      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG }}
          # The version name and code come from tags and the commit count.
          fetch-depth: 0

      - name: Run tests
        run: |
          git config --global --add safe.directory '*'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      # makepkg won't run as root; the package is built from the tag.
      - name: Build the package
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p /tmp/pkg && cp packaging/PKGBUILD /tmp/pkg/
          sed -i "s|^source=.*|source=(\"togu-player::git+file://$GITHUB_WORKSPACE#tag=$TAG\")|" /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          sudo -u builder git config --global --add safe.directory '*'
          (cd /tmp/pkg && sudo -u builder makepkg --nodeps --noconfirm)
          mkdir -p dist
          cp /tmp/pkg/togu-player-git-r*-x86_64.pkg.tar.zst "dist/togu-player-$TAG-x86_64.pkg.tar.zst"
          ls -l dist

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Matched literally: a tag's dots and any +build suffix are not regex.
          awk -v heading="## [$TAG]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A semver pre-release (a -suffix ahead of any +build) is published as one.
          prerelease=()
          case "${TAG%%+*}" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.pkg.tar.zst --clobber
            if [ -s notes.md ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          elif [ -s notes.md ]; then
            gh release create "$TAG" dist/*.pkg.tar.zst --verify-tag "${prerelease[@]}" --title "Togu $TAG" --notes-file notes.md
          else
            echo "No '## [$TAG]' section in CHANGELOG.md; generating notes." >&2
            gh release create "$TAG" dist/*.pkg.tar.zst --verify-tag "${prerelease[@]}" --title "Togu $TAG" --generate-notes
          fi
