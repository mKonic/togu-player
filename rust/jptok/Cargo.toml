[package]
name = "jptok"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# Same version as togu's lindera-wasm-web-ipadic 2.0.0, so words split the same way.
lindera = { version = "=2.0.1", default-features = false, features = ["embed-ipadic"] }
lindera-dictionary = "=2.0.1"
lindera-ipadic = { version = "=2.0.1", features = ["embed-ipadic"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
